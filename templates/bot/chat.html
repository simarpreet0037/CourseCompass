{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CourseCompass</title>
  <link rel="icon" type="image/png" href="{% static 'branding/logo.png' %}" />
  <link rel="shortcut icon" type="image/png" href="{% static 'branding/logo.png' %}" />
  <script src="https://unpkg.com/htmx.org@1.9.2"></script>
  <script src="https://unpkg.com/cytoscape@3.26.0/dist/cytoscape.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #07070e;
      --s1:          #0d0d18;
      --s2:          #12121e;
      --s3:          #19192a;
      --s4:          #222236;
      --amber:       #d97706;
      --amber-lt:    #f59e0b;
      --amber-dim:   #92500a;
      --amber-cream: #fdf4e3;
      --amber-glow:  rgba(217,119,6,.28);
      --violet:      #7c3aed;
      --violet-lt:   #a78bfa;
      --t1:          #f0f0f8;
      --t2:          #7a7a9a;
      --t3:          #3d3d58;
      --border:      rgba(255,255,255,.07);
      --border-2:    rgba(255,255,255,.13);
    }

    html, body { height: 100%; }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--t1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: .75rem;
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 26px 26px;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 55% 50% at 0% 0%, rgba(217,119,6,.07), transparent 55%),
        radial-gradient(ellipse 45% 40% at 100% 100%, rgba(124,58,237,.07), transparent 50%);
      pointer-events: none;
    }

    .top-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 54px;
      background: rgba(7,7,14,.93);
      backdrop-filter: blur(20px) saturate(1.5);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 1.5rem;
    }

    .top-bar::after {
      content: '';
      position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg,
        rgba(217,119,6,.55) 0%,
        rgba(124,58,237,.45) 55%,
        transparent 100%);
    }

    .top-bar-logo {
      display: flex; align-items: center; gap: .8rem;
      font-family: 'Outfit', sans-serif;
      font-size: 1.05rem; font-weight: 700;
      color: var(--t1); text-decoration: none;
      letter-spacing: -.01em;
    }

    .logo-image {
      width: 48px;
      height: 48px;
      object-fit: contain;
      display: block;
      flex-shrink: 0;
      filter: drop-shadow(0 4px 12px rgba(217,119,6,.18));
    }

    .top-bar-actions { display: flex; align-items: center; gap: .45rem; }

    .tb-btn {
      padding: .35rem .85rem; border-radius: 7px;
      font-size: .78rem; font-weight: 500;
      text-decoration: none; border: none; cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all .17s; line-height: 1;
    }
    .tb-btn.ghost { color: var(--t2); background: transparent; }
    .tb-btn.ghost:hover { color: var(--t1); background: rgba(255,255,255,.05); }
    .tb-btn.danger-soft {
      color: #f87171; background: transparent;
      border: 1px solid rgba(248,113,113,.18);
    }
    .tb-btn.danger-soft:hover { background: rgba(248,113,113,.08); }

    .chat-shell {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      width: 100%; max-width: 820px;
      height: calc(100vh - 54px - 1.5rem);
      margin-top: 54px;
      background: var(--s1);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(217,119,6,.07),
        0 28px 80px rgba(0,0,0,.55);
    }

    .chips-row {
      padding: .55rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex; flex-wrap: wrap; gap: .38rem;
      background: var(--s2);
    }

    .chip {
      font-size: .72rem; font-weight: 500;
      padding: .26rem .68rem; border-radius: 100px;
      border: 1px solid rgba(217,119,6,.22);
      color: var(--amber-lt);
      background: rgba(217,119,6,.05);
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all .15s;
    }
    .chip:hover {
      background: rgba(217,119,6,.14);
      border-color: rgba(217,119,6,.4);
      color: #fcd34d;
    }

    #chat-window {
      flex: 1; overflow-y: auto;
      padding: 1.5rem 1.25rem;
      scroll-behavior: smooth;
      display: flex; flex-direction: column; gap: 1rem;
    }
    #chat-window::-webkit-scrollbar { width: 4px; }
    #chat-window::-webkit-scrollbar-track { background: transparent; }
    #chat-window::-webkit-scrollbar-thumb {
      background: rgba(217,119,6,.2); border-radius: 99px;
    }

    .welcome-state {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 2rem; gap: 1.1rem;
    }

    .welcome-ring {
      width: 70px; height: 70px;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }

    .welcome-ring::before {
      content: '';
      position: absolute; inset: 0; border-radius: 50%;
      border: 1.5px solid transparent;
      background: linear-gradient(135deg, rgba(217,119,6,.6), rgba(124,58,237,.5)) border-box;
      -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: destination-out;
      mask-composite: exclude;
      animation: orbit 10s linear infinite;
    }

    @keyframes orbit { to { transform: rotate(360deg); } }

    .welcome-icon { font-size: 2rem; }

    .welcome-state h3 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.18rem; font-weight: 600;
      color: var(--t1); letter-spacing: -.02em;
    }

    .welcome-state p {
      font-size: .875rem; color: var(--t2);
      max-width: 310px; line-height: 1.72;
    }

    .chat-message {
      display: flex; align-items: flex-end; gap: .55rem;
      animation: rise .2s ease;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(7px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .chat-message.user { flex-direction: row-reverse; }
    .chat-message.bot  { flex-direction: row; }

    .avatar {
      width: 26px; height: 26px; border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700;
      font-family: 'Outfit', sans-serif;
      letter-spacing: -.02em;
    }
    .avatar.bot-av {
      background: transparent;
      color: #fff;
      overflow: hidden;
    }

    .bot-avatar-logo {
      width: 20px;
      height: 20px;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.35));
    }

    .avatar.user-av {
      background: var(--s4);
      border: 1px solid var(--border-2);
      color: var(--t2);
    }

    .chat-bubble {
      max-width: 74%;
      padding: .7rem 1rem;
      font-size: .875rem;
      line-height: 1.7;
    }

    .chat-bubble.user {
      background: linear-gradient(145deg, var(--amber), var(--amber-dim));
      color: var(--amber-cream);
      border-radius: 14px 14px 2px 14px;
    }

    .chat-bubble.bot {
      background: var(--s2);
      color: var(--t1);
      border-radius: 2px 14px 14px 14px;
      border-top: 1px solid var(--border);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      border-left: 2px solid var(--amber);
    }

    #mini-graph { background: transparent; border-radius: 8px; overflow: hidden; }

    .chat-footer {
      display: flex; align-items: flex-end; gap: .55rem;
      padding: .8rem 1rem;
      border-top: 1px solid var(--border);
      background: var(--s2);
    }

    #message-input {
      flex: 1; resize: none;
      background: var(--s3);
      color: var(--t1);
      border: 1px solid var(--border-2);
      border-radius: 10px;
      padding: .65rem .9rem;
      font-size: .875rem;
      font-family: 'DM Sans', sans-serif;
      line-height: 1.55;
      max-height: 120px;
      outline: none;
      transition: border-color .18s, box-shadow .18s;
    }
    #message-input:focus {
      border-color: rgba(217,119,6,.5);
      box-shadow: 0 0 0 3px rgba(217,119,6,.1);
    }
    #message-input::placeholder { color: var(--t3); }

    .btn-send {
      background: var(--amber);
      color: #07070e;
      border: none; cursor: pointer;
      padding: .65rem 1.3rem; border-radius: 10px;
      font-size: .85rem; font-weight: 700;
      font-family: 'Outfit', sans-serif;
      letter-spacing: -.01em;
      box-shadow: 0 2px 14px var(--amber-glow);
      transition: transform .15s, box-shadow .15s, background .15s;
      flex-shrink: 0;
    }
    .btn-send:hover {
      background: var(--amber-lt);
      transform: translateY(-1px);
      box-shadow: 0 4px 22px var(--amber-glow);
    }
    .btn-send:active { transform: translateY(0); }
  </style>
</head>
<body>

  <nav class="top-bar">
    <a href="/" class="top-bar-logo">
      <img src="{% static 'branding/logo.png' %}" alt="CourseCompass logo" class="logo-image">
      CourseCompass
    </a>
    <div class="top-bar-actions">
      <a href="{% url 'view_courses' %}" class="tb-btn ghost">Courses</a>
      <form method="post" action="{% url 'bot:clear_history' %}" style="display:inline">
        {% csrf_token %}
        <button type="submit" class="tb-btn danger-soft">Clear chat</button>
      </form>
    </div>
  </nav>

  <div class="chat-shell">
    <div class="chips-row">
      <div class="chip" onclick="fillSample('What course should I take after CS210?')">After CS210?</div>
      <div class="chip" onclick="fillSample('What are the prerequisites for CS215?')">Prereqs for CS215</div>
      <div class="chip" onclick="fillSample('Suggest an optimized path to finish my CS major.')">Optimize my plan</div>
      <div class="chip" onclick="fillSample('Can I take CS110 and CS115 together?')">Can I co-take these?</div>
    </div>

    <div id="chat-window">
      <div class="welcome-state" id="welcome-state">
        <div class="welcome-ring">
          <div class="welcome-icon">&#x1F9ED;</div>
        </div>
        <h3>Your Academic Advisor</h3>
        <p>Ask about prerequisites, course sequences, degree planning, or anything academic.</p>
      </div>
    </div>

    <form
      id="chat-form"
      method="POST"
      hx-post="{% url 'bot:send_message' %}"
      hx-target="#chat-window"
      hx-swap="beforeend"
      hx-trigger="submit"
      class="chat-footer"
    >
      {% csrf_token %}
      <textarea
        id="message-input"
        name="message"
        rows="1"
        placeholder="Ask about courses, prereqs, or your degree plan&#x2026;"
        required
      ></textarea>
      <button type="submit" class="btn-send">Send</button>
    </form>
  </div>

  <script>
    function fillSample(text) {
      document.getElementById("message-input").value = text;
      document.getElementById("message-input").focus();
    }

    var chatWindow   = document.getElementById("chat-window");
    var messageInput = document.getElementById("message-input");
    var chatForm     = document.getElementById("chat-form");
    var welcomeState = document.getElementById("welcome-state");

    messageInput.addEventListener("keydown", function(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        chatForm.requestSubmit();
      }
    });

    messageInput.addEventListener("input", function() {
      this.style.height = "auto";
      this.style.height = Math.min(this.scrollHeight, 120) + "px";
    });

    document.body.addEventListener("htmx:beforeRequest", function() {
      if (welcomeState) welcomeState.style.display = "none";
    });

    document.body.addEventListener("htmx:afterSwap", function(e) {
      if (e.detail.target.id === "chat-window") {
        chatWindow.scrollTop = chatWindow.scrollHeight;
        messageInput.value = "";
        messageInput.style.height = "auto";
        document.dispatchEvent(new Event("renderCytoscapeGraph"));
      }
    });

    // ── node colour ─────────────────────────────────────────────────────────
    function nodeColor(ele) {
      var kind = ele.data("kind");
      if (kind === "target" || kind === "focus") return "#d97706";
      if (kind === "source")  return "#059669";
      if (kind === "next")    return "#0369a1";
      if (ele.data("recommended")) return "#7c3aed";
      return "#222236";
    }

    // ── shared cytoscape style ──────────────────────────────────────────────
    var CY_STYLE = [
      {
        selector: "node",
        style: {
          "label": "data(label)",
          "text-valign": "center",
          "color": "#f0f0f8",
          "background-color": nodeColor,
          "border-width": 1,
          "border-color": "rgba(255,255,255,.15)",
          "font-size": 11,
          "shape": "round-rectangle",
          "padding": "6px"
        }
      },
      {
        selector: "edge",
        style: {
          "width": 1.5,
          "line-color": "#3d3d58",
          "target-arrow-color": "#3d3d58",
          "target-arrow-shape": "triangle",
          "curve-style": "bezier"
        }
      }
    ];

    // ── layout post-processors ─────────────────────────────────────────────

    // prereq: target course pinned to bottom, prerequisites above by depth
    function layoutPrereq(cy) {
      var anchor = cy.nodes('[kind = "target"]').first();
      if (!anchor.length || cy.nodes().length < 2) return;
      var levelById = {};
      levelById[anchor.id()] = 0;
      var queue = [anchor];
      while (queue.length) {
        var cur = queue.shift();
        var curLvl = levelById[cur.id()] || 0;
        cur.incomers("edge").forEach(function(e) {
          var src = e.source();
          var nl = curLvl + 1;
          if (levelById[src.id()] === undefined || nl > levelById[src.id()]) {
            levelById[src.id()] = nl; queue.push(src);
          }
        });
      }
      repositionByLevel(cy, levelById, "bottom");
    }

    // next: source course pinned to top, follow-on courses below
    function layoutNext(cy) {
      var anchor = cy.nodes('[kind = "source"]').first();
      if (!anchor.length || cy.nodes().length < 2) return;
      var levelById = {};
      levelById[anchor.id()] = 0;
      var queue = [anchor];
      while (queue.length) {
        var cur = queue.shift();
        var curLvl = levelById[cur.id()] || 0;
        cur.outgoers("edge").forEach(function(e) {
          var tgt = e.target();
          var nl = curLvl + 1;
          if (levelById[tgt.id()] === undefined || nl > levelById[tgt.id()]) {
            levelById[tgt.id()] = nl; queue.push(tgt);
          }
        });
      }
      repositionByLevel(cy, levelById, "top");
    }

    // neighborhood: focus in centre, prereqs at top, next courses at bottom
    function layoutNeighborhood(cy) {
      var bounds = getBounds(cy);
      var midY = (bounds.minY + bounds.maxY) / 2;
      var step = Math.max((bounds.maxY - bounds.minY) / 2, 72);
      cy.nodes('[side = "prereq"]').positions(function(n) { return { x: n.position("x"), y: bounds.minY }; });
      cy.nodes('[kind = "focus"]').positions(function(n) { return { x: n.position("x"), y: midY }; });
      cy.nodes('[side = "next"]').positions(function(n) { return { x: n.position("x"), y: bounds.maxY }; });
      cy.fit(undefined, 20);
    }

    // roadmap: courses grouped by academic level, earliest level at top
    function layoutRoadmap(cy) {
      var levelGroups = {};
      cy.nodes().forEach(function(n) {
        var lvl = n.data("level") || 100;
        if (!levelGroups[lvl]) levelGroups[lvl] = [];
        levelGroups[lvl].push(n);
      });
      var sortedLevels = Object.keys(levelGroups).map(Number).sort(function(a, b) { return a - b; });
      var step = 90;
      sortedLevels.forEach(function(lvl, idx) {
        var nodes = levelGroups[lvl];
        var spanW = (nodes.length - 1) * 110;
        nodes.forEach(function(n, i) {
          n.position({ x: -spanW / 2 + i * 110, y: idx * step });
        });
      });
      cy.fit(undefined, 20);
    }

    // ── helpers ─────────────────────────────────────────────────────────────
    function getBounds(cy) {
      var minY = Infinity, maxY = -Infinity;
      cy.nodes().forEach(function(n) {
        var y = n.position("y");
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      });
      return { minY: minY, maxY: maxY };
    }

    function repositionByLevel(cy, levelById, anchor) {
      var maxLevel = 0;
      Object.keys(levelById).forEach(function(id) { if (levelById[id] > maxLevel) maxLevel = levelById[id]; });
      var b = getBounds(cy);
      var step = Math.max((b.maxY - b.minY) / Math.max(maxLevel, 1), 72);
      cy.nodes().positions(function(node) {
        var pos = node.position();
        var level = levelById[node.id()];
        if (level === undefined) return { x: pos.x, y: pos.y };
        // anchor="bottom": level 0 at bottom, level maxLevel at top
        // anchor="top":    level 0 at top,    level maxLevel at bottom
        var rankFromTop = anchor === "bottom" ? maxLevel - level : level;
        return { x: pos.x, y: b.minY + rankFromTop * step };
      });
      cy.fit(undefined, 20);
    }

    // ── main renderer ───────────────────────────────────────────────────────
    document.addEventListener("renderCytoscapeGraph", function() {
      document.querySelectorAll("[data-graph]").forEach(function(container) {
        var rawData = container.dataset.graph;
        if (!rawData) return;
        var graphData;
        try { graphData = JSON.parse(rawData); } catch(e) { return; }
        if (container._cy) container._cy.destroy();

        var graphType = container.dataset.graphType || "prereq";

        var cy = cytoscape({
          container: container,
          elements: graphData.elements,
          style: CY_STYLE
        });

        // Roadmap positions are computed purely by level data — no need for breadthfirst.
        if (graphType === "roadmap") {
          layoutRoadmap(cy);
          container._cy = cy;
          return;
        }

        var layout = cy.layout({ name: "breadthfirst", directed: true, padding: 20, spacingFactor: 1.2 });
        layout.once("layoutstop", function() {
          if      (graphType === "next")         layoutNext(cy);
          else if (graphType === "neighborhood") layoutNeighborhood(cy);
          else                                   layoutPrereq(cy);
        });
        layout.run();
        container._cy = cy;
      });
    });
  </script>
</body>
</html>
