name: Deploy to GCE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to GCE VM
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.GCE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.GCE_HOST }} >> ~/.ssh/known_hosts

    - name: Copy project files to GCE VM
      run: |
        rsync -avz --exclude='.git' -e "ssh -i ~/.ssh/id_rsa" . ${{ secrets.GCE_USER }}@${{ secrets.GCE_HOST }}:/home/${{ secrets.GCE_USER }}/CourseCompass

    - name: Deploy on GCE VM
      run: |
        ssh -i ~/.ssh/id_rsa ${{ secrets.GCE_USER }}@${{ secrets.GCE_HOST }} << EOF
          cd /home/${{ secrets.GCE_USER }}/CourseCompass

          # Generate .env file securely
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" > .env
          echo "NEO4J_URI=${{ secrets.NEO4J_URI }}" >> .env
          echo "NEO4J_USERNAME=${{ secrets.NEO4J_USERNAME }}" >> .env
          echo "NEO4J_PASSWORD=${{ secrets.NEO4J_PASSWORD }}" >> .env
          echo "ALLOWED_HOSTS=localhost,127.0.0.1,${{ secrets.GCE_HOST }}" >> .env
          echo "USE_HTTPS=false" >> .env
          echo "CSRF_TRUSTED_ORIGINS=http://${{ secrets.GCE_HOST }},http://localhost" >> .env

          cd docker
          docker-compose up -d --build
        EOF