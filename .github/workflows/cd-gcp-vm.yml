name: CD to GCP VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cd-gcp-vm
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Deploy over SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_SSH_PORT: ${{ secrets.VM_SSH_PORT }}
          VM_APP_DIR: ${{ secrets.VM_APP_DIR }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_ENV: ${{ secrets.DJANGO_ENV }}
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
          CSRF_TRUSTED_ORIGINS: ${{ secrets.CSRF_TRUSTED_ORIGINS }}
          USE_HTTPS: ${{ secrets.USE_HTTPS }}
          CHAT_RATE_LIMIT: ${{ secrets.CHAT_RATE_LIMIT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          BRANCH_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${VM_HOST}" ] || [ -z "${VM_USER}" ] || [ -z "${VM_SSH_KEY}" ]; then
            echo "Missing required SSH secrets. Required: VM_HOST, VM_USER, VM_SSH_KEY"
            exit 1
          fi

          if [ -z "${DJANGO_SECRET_KEY:-}" ] || [ -z "${GROQ_API_KEY:-}" ] || [ -z "${NEO4J_URI:-}" ] || [ -z "${NEO4J_USERNAME:-}" ] || [ -z "${NEO4J_PASSWORD:-}" ]; then
            echo "Missing app env secrets. Required: DJANGO_SECRET_KEY, GROQ_API_KEY, NEO4J_URI, NEO4J_USERNAME, NEO4J_PASSWORD."
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "${VM_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${VM_SSH_PORT:-22}" -H "${VM_HOST}" >> ~/.ssh/known_hosts

          ssh -p "${VM_SSH_PORT:-22}" "${VM_USER}@${VM_HOST}" "BRANCH_NAME='${BRANCH_NAME}' REPO='${REPO}' REMOTE_APP_DIR='${VM_APP_DIR:-}' bash -s" << 'REMOTE_SCRIPT'
          set -euo pipefail

          # Resolve APP_DIR on the VM so $HOME is the VM user's home.
          APP_DIR="${REMOTE_APP_DIR:-$HOME/coursecompass}"

          # Ensure app directory exists and has latest branch code.
          mkdir -p "${APP_DIR}"
          if [ ! -d "${APP_DIR}/.git" ]; then
            git clone "https://github.com/${REPO}.git" "${APP_DIR}"
          fi

          cd "${APP_DIR}"
          git fetch --prune origin
          git checkout "${BRANCH_NAME}"
          git reset --hard "origin/${BRANCH_NAME}"

          mkdir -p docker
          cat > docker/.env << EOF
          SECRET_KEY=${DJANGO_SECRET_KEY}
          DJANGO_ENV=${DJANGO_ENV:-production}
          ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
          CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-}
          USE_HTTPS=${USE_HTTPS:-false}
          CHAT_RATE_LIMIT=${CHAT_RATE_LIMIT:-30}
          GROQ_API_KEY=${GROQ_API_KEY}
          NEO4J_URI=${NEO4J_URI}
          NEO4J_USERNAME=${NEO4J_USERNAME}
          NEO4J_PASSWORD=${NEO4J_PASSWORD}
          EOF
          chmod 600 docker/.env

          cd docker
          if ! command -v docker >/dev/null 2>&1; then
            echo "Docker is not installed or not in PATH on the VM."
            exit 1
          fi

          if ! docker compose version >/dev/null 2>&1; then
            echo "Docker Compose plugin is required but not available. Install docker-compose-plugin on the VM."
            exit 1
          fi

          docker compose up -d --build --remove-orphans

          docker image prune -f
          REMOTE_SCRIPT
