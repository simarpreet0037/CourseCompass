name: CD to GCP VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cd-gcp-vm
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Deploy over SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_SSH_PORT: ${{ secrets.VM_SSH_PORT }}
          VM_APP_DIR: ${{ secrets.VM_APP_DIR }}
          APP_PUBLIC_HOST: ${{ secrets.APP_PUBLIC_HOST }}
          APP_PUBLIC_IP: ${{ secrets.APP_PUBLIC_IP }}
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
          BRANCH_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${VM_HOST}" ] || [ -z "${VM_USER}" ] || [ -z "${VM_SSH_KEY}" ] || [ -z "${PROD_ENV_FILE}" ]; then
            echo "Missing required secrets. Required: VM_HOST, VM_USER, VM_SSH_KEY, PROD_ENV_FILE"
            exit 1
          fi

          SSH_PORT="${VM_SSH_PORT:-22}"
          APP_DIR="${VM_APP_DIR:-}"  # default resolved on VM

          mkdir -p ~/.ssh
          printf '%s\n' "${VM_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${SSH_PORT}" -H "${VM_HOST}" >> ~/.ssh/known_hosts

          ssh -p "${SSH_PORT}" "${VM_USER}@${VM_HOST}" "BRANCH_NAME='${BRANCH_NAME}' REPO='${REPO}' REMOTE_APP_DIR='${APP_DIR}' REMOTE_PUBLIC_HOST='${APP_PUBLIC_HOST}' REMOTE_PUBLIC_IP='${APP_PUBLIC_IP}' bash -s" << 'REMOTE_SCRIPT'
          set -euo pipefail

          # Resolve APP_DIR on the VM so $HOME is the VM user's home.
          APP_DIR="${REMOTE_APP_DIR:-$HOME/coursecompass}"

          # Ensure app directory exists and has latest branch code.
          mkdir -p "${APP_DIR}"
          if [ ! -d "${APP_DIR}/.git" ]; then
            git clone "https://github.com/${REPO}.git" "${APP_DIR}"
          fi

          cd "${APP_DIR}"
          git fetch --prune origin
          git checkout "${BRANCH_NAME}"
          git reset --hard "origin/${BRANCH_NAME}"

          mkdir -p docker
          cat > docker/.env << 'EOF'
          ${{ secrets.PROD_ENV_FILE }}
          EOF
          chmod 600 docker/.env

          PUBLIC_HOST_VALUE="${REMOTE_PUBLIC_HOST:-${REMOTE_PUBLIC_IP:-}}"
          if [ -n "${PUBLIC_HOST_VALUE}" ]; then
            echo "PUBLIC_HOST=${PUBLIC_HOST_VALUE}" >> docker/.env
          fi

          cd docker
          if ! command -v docker >/dev/null 2>&1; then
            echo "Docker is not installed or not in PATH on the VM."
            exit 1
          fi

          if ! docker compose version >/dev/null 2>&1; then
            echo "Docker Compose plugin is required but not available. Install docker-compose-plugin on the VM."
            exit 1
          fi

          docker compose up -d --build --remove-orphans

          docker image prune -f
          REMOTE_SCRIPT
