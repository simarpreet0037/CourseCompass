version: '3.8'

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: gunicorn CourseCompass.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 4 --timeout 120
    volumes:
      - ../staticfiles:/app/staticfiles
      - ../db.sqlite3:/app/db.sqlite3
    ports:
      - "80:8000"
    env_file:
      - .env
    environment:
      - DJANGO_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/chat/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

